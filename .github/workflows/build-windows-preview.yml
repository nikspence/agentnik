name: Build Windows onedir preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Choose artifact label
        id: label
        shell: pwsh
        run: |
          $label = 'windows-preview'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = python -c "from agentnik import __version__; print(__version__)"
            if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -cne "v$version") {
              throw 'Build tag must match the application version.'
            }
            $label = $env:GITHUB_REF_NAME
          }
          "label=$label" >> $env:GITHUB_OUTPUT
      - name: Build and smoke-test both launchers
        shell: pwsh
        run: |
          python -m venv .venv-build
          ./.venv-build/Scripts/python.exe -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv-build/Scripts/python.exe tools/build_release.py --label ${{ steps.label.outputs.label }} --build --smoke
          exit $LASTEXITCODE
      - name: Verify the frozen terminal in Windows ConPTY
        shell: pwsh
        run: |
          python -m pip install pywinpty==3.1.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/conpty_composer_smoke.py --exe dist/build-${{ steps.label.outputs.label }}/dist/Agentnik/Agentnik-Terminal.exe
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v6
        with:
          name: agentnik-windows-onedir-preview
          path: |
            dist/build-${{ steps.label.outputs.label }}/Agentnik-${{ steps.label.outputs.label }}-windows-x64.zip
            dist/build-${{ steps.label.outputs.label }}/Agentnik-${{ steps.label.outputs.label }}-windows-x64.zip.sha256
          if-no-files-found: error
