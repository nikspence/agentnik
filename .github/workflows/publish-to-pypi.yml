name: Build or publish Python distributions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the checked distributions to PyPI (requires a matching release tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release tag
        if: inputs.publish
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from agentnik import __version__

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if version != __version__ or os.environ["GITHUB_REF"] != f"refs/tags/v{version}":
              raise SystemExit("Select the release tag v" + version + " and keep package versions in sync.")
          PY
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build --outdir dist/pypi
          python -m twine check --strict dist/pypi/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/pypi/
          if-no-files-found: error

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentnik/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
