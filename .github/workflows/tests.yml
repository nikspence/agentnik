name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Prepare canonical temporary directory
        run: >-
          python -c "import os, pathlib; p = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'agentnik-tests'; p.mkdir(exist_ok=True); f = open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8'); [f.write(f'{key}={p}\n') for key in ('TMPDIR', 'TMP', 'TEMP')]; f.close()"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python tools/run_offline_tests.py

      - name: Check compilation
        run: python -m compileall -q agentnik tests

  terminal:
    name: Terminal without Qt / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install terminal dependencies
        run: python -m pip install ".[terminal]"
      - name: Verify the installed launcher outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from importlib.util import find_spec; assert find_spec('PySide6') is None"
          agentnik code --help
      - name: Run offline terminal tests
        run: python -m unittest discover -s tests -p test_code_terminal.py -v
