name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Prepare canonical temporary directory
        run: >-
          python -c "import os, pathlib; p = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'agentnik-tests'; p.mkdir(exist_ok=True); f = open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8'); [f.write(f'{key}={p}\n') for key in ('TMPDIR', 'TMP', 'TEMP')]; f.close()"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python tools/run_offline_tests.py

      - name: Check compilation
        run: python -m compileall -q agentnik tests

  terminal:
    name: Terminal without Qt / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build and check release distributions
        run: |
          python -m pip install build twine
          python -m build --outdir dist/pypi-check
          python -m twine check --strict dist/pypi-check/*
      - name: Install the built wheel with terminal extras
        run: >-
          python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('dist/pypi-check').glob('*.whl');
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[terminal]'])"
      - name: Verify the installed launcher outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          agentnik code --help
      - name: Verify installed session discovery without a terminal
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import json, pathlib, subprocess, tempfile;
          temp = tempfile.TemporaryDirectory(prefix='agentnik workspace ');
          project = pathlib.Path(temp.name);
          profile = project / 'unused profile';
          result = subprocess.run(['agentnik', 'code', str(project), '--data-dir', str(profile), '--list-sessions'],
          stdin=subprocess.DEVNULL, capture_output=True, text=True, check=True, timeout=20);
          assert json.loads(result.stdout) == [] and not result.stderr and not profile.exists();
          temp.cleanup()"
      - name: Verify terminal extras are present without Qt
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "from importlib.util import find_spec; import PIL, prompt_toolkit, pypdf;
          assert find_spec('PySide6') is None"
      - name: Run offline terminal tests
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "${{ github.workspace }}/tests" -p test_code_terminal.py -v
      - name: Run offline terminal OAuth tests
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "${{ github.workspace }}/tests" -p test_mcp_oauth_signin.py -v
      - name: Exercise installed terminal composer through Windows ConPTY
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install pywinpty
          python "${{ github.workspace }}/tools/conpty_composer_smoke.py"
      - name: Exercise installed terminal over authenticated Linux SSH
        if: runner.os == 'Linux' && matrix.python == '3.12'
        timeout-minutes: 5
        run: |
          set -- dist/pypi-check/*.whl
          test "$#" -eq 1 && test -f "$1"
          docker run --rm \
            --mount "type=bind,src=$PWD/dist/pypi-check,dst=/preview,readonly" \
            --mount "type=bind,src=$PWD/tools,dst=/tools,readonly" \
            python:3.12-slim sh /tools/ssh_terminal_smoke.sh "/preview/${1##*/}"
      - name: Exercise installed terminal composer through a POSIX PTY
        if: runner.os == 'macOS' || runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install pexpect
          python "${{ github.workspace }}/tools/posix_composer_smoke.py"
