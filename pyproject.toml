[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentnik"
version = "0.7.3"
authors = [{name = "Nikolaus Spence"}]
description = "Cross-platform LLM chat and System One decision desktop client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "keyring>=25,<26", "dulwich>=0.25,<0.26", "PyYAML>=6.0.3,<7", "regex>=2024.11.6,<2027"]

[project.gui-scripts]
agentnik = "agentnik.ui:main"

[tool.setuptools.packages.find]
include = ["agentnik*"]

[tool.setuptools.package-data]
agentnik = ["assets/*.svg", "assets/*.png", "assets/*.ico", "translations/*.qm", "translations/*.ts"]
